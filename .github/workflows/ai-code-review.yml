name: AI Automated Code Review (GCP Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths-ignore:
      - 'GEMINI.md'
      - '.gemini/**'

jobs:
  ai-code-review:
    name: Senior Engineer AI PR Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate PR Git Diff
        id: get-diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "DIFF_SIZE=$(wc -l < pr_diff.txt)" >> $GITHUB_ENV

      - name: Run GCP Gemini AI Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.log("GEMINI_API_KEY secret not found. Skipping live AI code review comment.");
              return;
            }

            const diffContent = fs.readFileSync('pr_diff.txt', 'utf8').slice(0, 15000); // Top 15k chars for token safety
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || "No description provided.";

            const systemPrompt = `You are a Senior Principal Software Architect conducting an automated code review on a GitHub Pull Request.
            Review the following PR changes for:
            1. Architecture & Design Smells
            2. Performance & Memory Leaks
            3. Security Vulnerabilities
            4. C# .NET 10 & React 19 best practices
            5. Recommendations & Praises

            Provide a clear, markdown-formatted code review comment summarizing strengths, potential bugs, and actionable suggestions.`;

            const prompt = `${systemPrompt}\n\nPR Title: ${prTitle}\nPR Description: ${prBody}\n\nGit Diff:\n\`\`\`diff\n${diffContent}\n\`\`\``;

            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ role: 'user', parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.2, maxOutputTokens: 1000 }
                })
              });

              const data = await response.json();
              const reviewText = data.candidates?.[0]?.content?.parts?.[0]?.text || "AI Code Review complete. No major issues detected.";

              const commentBody = `### 🤖 Automated AI Code Review (GCP Gemini)\n\n${reviewText}\n\n---\n*Automated review generated by GCP Gemini 1.5/2.5 Flash for PR #${context.issue.number}*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            } catch (err) {
              console.error("Error executing Gemini AI Code Review:", err);
            }
