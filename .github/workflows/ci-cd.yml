name: CI/CD Pipeline - ASP.NET Core 10 & React

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Build & Test ASP.NET Core 10 API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PortfolioApi.Tests/PortfolioApi.Tests.csproj

      - name: Build Backend
        run: dotnet build PortfolioApi.Tests/PortfolioApi.Tests.csproj --no-restore -c Release

      - name: Execute xUnit Tests
        run: dotnet test PortfolioApi.Tests/PortfolioApi.Tests.csproj --no-build -c Release --verbosity normal

  frontend-tests:
    name: Build & Test React Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd client
          npm test

      - name: Build React Bundle
        run: |
          cd client
          npm run build

  docker-build:
    name: Build Multi-Stage Docker Container
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: portfolio-app:latest
