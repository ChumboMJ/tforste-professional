name: CI/CD Pipeline - ASP.NET Core 10 & React

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'GEMINI.md'
      - '.gemini/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'GEMINI.md'
      - '.gemini/**'

jobs:
  backend-tests:
    name: Build & Test ASP.NET Core 10 API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PortfolioApi.Tests/PortfolioApi.Tests.csproj

      - name: Build Backend
        run: dotnet build PortfolioApi.Tests/PortfolioApi.Tests.csproj --no-restore -c Release

      - name: Execute xUnit Tests with Code Coverage
        run: dotnet test PortfolioApi.Tests/PortfolioApi.Tests.csproj --no-build -c Release --settings PortfolioApi.Tests/coverlet.runsettings --collect:"XPlat Code Coverage"

      - name: Enforce 70% Backend Code Coverage Gate for Merges to Main
        run: node .github/scripts/check-coverage.js

  frontend-tests:
    name: Build & Test React Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Vitest Unit Tests & Generate Coverage
        run: |
          cd client
          npm run test:coverage

      - name: Build React Bundle
        run: |
          cd client
          npm run build

  docker-build:
    name: Build Environment Differentiated Docker Containers
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Environment & Tag
        id: env-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=portfolio-app:prod" >> $GITHUB_ENV
            echo "APP_ENV=Production" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=portfolio-app:dev" >> $GITHUB_ENV
            echo "APP_ENV=Development" >> $GITHUB_ENV
          fi

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_TAG }}
